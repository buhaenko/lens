name: Release
on:
  push:
    tags: ['v*']

permissions:
  contents: write
  pages: write
  id-token: write
  actions: read

jobs:
  release:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Tests
        run: scripts/test.sh
      - name: Build
        run: scripts/build.sh "${GITHUB_REF_NAME#v}"
      - name: Sign the update
        env:
          UPDATE_SIGNING_KEY: ${{ secrets.UPDATE_SIGNING_KEY }}
        run: swift scripts/sign-update.swift build/Lensy.zip > build/Lensy.zip.sig
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" build/Lensy.dmg build/Lensy.zip build/Lensy.zip.sig build/SHA256SUMS.txt \
            --title "Lensy ${GITHUB_REF_NAME#v}" --notes-from-tag

  site:
    needs: release
    uses: ./.github/workflows/pages.yml
